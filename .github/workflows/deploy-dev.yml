name: Deploy demo bot to dev

# Deploys the bot instance that quotes on the public DevNet demo desk. Only the
# `maker-bot` service is touched: the compose file on the host is owned by the
# desk repo's deploy, and this workflow just publishes a new image and restarts
# that one container.
#
# Concurrency groups are per-repository, so this cannot serialize against the
# desk's own deploy — that is fine, the two touch disjoint services.

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  guard-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Verify dispatched from main
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "deploy-dev must be dispatched from the 'main' branch (got: ${{ github.ref_name }})" >&2
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    needs: guard-branch
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          # Package named after this repo, so it is owned by it and the default
          # GITHUB_TOKEN may push. Keep it public: the desk's own deploy runs an
          # unscoped `docker compose pull` on the same host with a token that has
          # no read access to another repo's private package.
          tags: ghcr.io/cessio-cc/cessio-demo-maker-bot:dev
          cache-from: type=gha,scope=maker-bot
          cache-to: type=gha,mode=max,scope=maker-bot

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: dev
    steps:
      - name: Pull the bot image and restart only the bot
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: GHCR_TOKEN,GHCR_USER
          script: |
            set -e
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            cd ~/cessio
            docker compose pull maker-bot
            docker compose up -d maker-bot
            docker logout ghcr.io
